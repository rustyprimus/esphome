# substitutions:
#   device_name: "soilmoisture1"
#   friendly_name: "Soil Moisture Sensor 1"

packages:
  # Apollo's complete battery-powered PLT-1B hardware configuration
  apollo_plt1b:
    url: https://github.com/ApolloAutomation/PLT-1
    ref: main
    files:
      - Integrations/ESPHome/PLT-1B.yaml
    refresh: 1d

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Keep the fallback access point in case normal Wi-Fi fails.
# ap:
#   ssid: "${friendly_name} Setup"
#   password: !secret fallback_ap_password

deep_sleep:
  id: deep_sleep_1
  sleep_duration: 12h
  run_duration: 30min
    # Optional static configuration. Leave this section commented initially.
  #
  # manual_ip:
  #   static_ip: 10.10.0.51
  #   gateway: 10.10.0.138
  #   subnet: 255.255.0.0
  #   dns1: 10.10.0.138

captive_portal:

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password

  client_id: "${device_name}"
  topic_prefix: "sensors/soil_moisture/${device_name}"

  # You are not using Home Assistant MQTT discovery.
  discovery: false
  discover_ip: true

  # Do not send ESPHome logs through MQTT.
  log_topic: null

  # QoS 1 is useful for a sleeping battery device.
  birth_message:
    topic: "sensors/soil_moisture/${device_name}/status"
    payload: "online"
    qos: 1
    retain: true

  will_message:
    topic: "sensors/soil_moisture/${device_name}/status"
    payload: "offline"
    qos: 1
    retain: true

  shutdown_message:
    topic: "sensors/soil_moisture/${device_name}/status"
    payload: "sleeping"
    qos: 1
    retain: true

  # Do not endlessly reboot if the future Mosquitto broker is unavailable.
  reboot_timeout: 0s

  # Give each MQTT publication time to leave the device.
  keepalive: 15s

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password